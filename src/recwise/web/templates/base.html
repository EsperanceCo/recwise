<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recwise{% block title_suffix %}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
    th { background: #f0f0f0; }
    .amount { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 1rem; background: #eee; font-size: 0.8rem; }
    button { cursor: pointer; }
    .accept { background: #d6f5d6; }
    .reject { background: #f5d6d6; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Dashboard</a>
    <a href="{{ url_for('review_list') }}">Review</a>
    <a href="{{ url_for('statement_view') }}">Statement</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
