# NOTE: ruff/bandit/mypy revs below are chosen to match the pinned versions in
# requirements-dev.lock. gitleaks and pre-commit-hooks revs are best-effort;
# run `pre-commit autoupdate` and re-check before relying on them long-term.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies: ["pytest==9.1.1", "hypothesis==6.168.0"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: no-spreadsheet-files-outside-sample-data
        name: block csv/xlsx/xls/pdf outside sample_data/
        entry: python scripts/check_no_data_files.py
        language: system
        pass_filenames: true
