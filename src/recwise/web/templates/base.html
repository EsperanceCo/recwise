<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='22' fill='%230c5a49'/%3E%3Cpath d='M24 30H72' stroke='%23fff' stroke-width='9' stroke-linecap='round' fill='none'/%3E%3Cpath d='M24 58H40L50 68L72 46' stroke='%23d6a13a' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <title>Recwise{% block title_suffix %}{% endblock %}</title>
  <style>
    /* Recwise brand tokens. Source of truth: the Recwise design system (tokens.json).
       Fonts are bundled in static/fonts so the app never touches the network. */
    @font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("{{ url_for('static', filename='fonts/IBMPlexSans-Regular.woff2') }}") format("woff2"); }
    @font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-style: normal; font-display: swap; src: url("{{ url_for('static', filename='fonts/IBMPlexSans-Medium.woff2') }}") format("woff2"); }
    @font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-style: normal; font-display: swap; src: url("{{ url_for('static', filename='fonts/IBMPlexSans-SemiBold.woff2') }}") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-style: normal; font-display: swap; src: url("{{ url_for('static', filename='fonts/IBMPlexMono-Regular.woff2') }}") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-style: normal; font-display: swap; src: url("{{ url_for('static', filename='fonts/IBMPlexMono-Medium.woff2') }}") format("woff2"); }

    :root {
      --bg: #f6f4ee;
      --surface: #fffdf9;
      --surface-sunken: #ece8dd;
      --border: #dcd7c8;
      --border-control: #7d7a6c;
      --ink: #16201c;
      --ink-muted: #4f5a54;
      --brand: #0c5a49;
      --brand-hover: #084538;
      --on-brand: #ffffff;
      --brand-tint: #dbebe4;
      --brand-deep: #062f27;
      --on-brand-deep: #e9efea;
      --accent: #d6a13a;
      --on-accent: #2a1d00;
      --accent-text: #7a4f00;
      --focus-ring: #1d5fb5;
      --success-bg: #dcefe2;
      --success-text: #14532d;
      --warning-bg: #fbebc8;
      --warning-text: #6a4300;
      --danger: #a8281d;
      --danger-bg: #f8dcd5;
      --danger-text: #86201a;
      --info-bg: #dce8f2;
      --info-text: #1b4a72;
      --shadow-raised: 0 1px 2px rgba(22,32,28,0.06), 0 1px 8px rgba(22,32,28,0.06);
      --shadow-overlay: 0 8px 24px rgba(22,32,28,0.14), 0 2px 6px rgba(22,32,28,0.08);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --space-8: 64px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 999px;
      --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1512;
        --surface: #161e1a;
        --surface-sunken: #0b100e;
        --border: #27332d;
        --border-control: #75857c;
        --ink: #e9efea;
        --ink-muted: #a4b2aa;
        --brand: #62c7a6;
        --brand-hover: #83d6ba;
        --on-brand: #052219;
        --brand-tint: #17322a;
        --brand-deep: #0a2a22;
        --on-brand-deep: #e9efea;
        --accent: #e0b04e;
        --on-accent: #2a1d00;
        --accent-text: #e0b04e;
        --focus-ring: #7cb4f5;
        --success-bg: #163524;
        --success-text: #8fdcaa;
        --warning-bg: #3a2c0c;
        --warning-text: #f0c66a;
        --danger: #f08a7e;
        --danger-bg: #3d1b17;
        --danger-text: #f4a398;
        --info-bg: #172c40;
        --info-text: #9cc7ee;
        --shadow-raised: 0 1px 2px rgba(0,0,0,0.4), 0 1px 8px rgba(0,0,0,0.4);
        --shadow-overlay: 0 8px 24px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      font-size: 15px;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      min-height: 100vh;
      line-height: 22px;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--brand); text-decoration: none; }
    a:hover { color: var(--brand-hover); text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-raised);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .app-header-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 var(--space-5);
      display: flex;
      align-items: center;
      gap: var(--space-6);
      height: 56px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-weight: 600;
      font-size: 18px;
      line-height: 24px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .brand:hover { text-decoration: none; color: var(--ink); }
    .brand svg { width: 28px; height: 28px; display: block; }
    .mark-tile { fill: var(--brand); }
    .mark-bar { stroke: var(--on-brand); }
    .mark-tick { stroke: var(--accent); }
    @media (prefers-color-scheme: dark) { .mark-tick { stroke: var(--on-brand); } }
    .app-nav { display: flex; gap: var(--space-1); }
    .app-nav a {
      color: var(--ink-muted);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      padding: 6px 12px;
      border-radius: var(--radius-md);
    }
    .app-nav a:hover { background: var(--surface-sunken); text-decoration: none; color: var(--ink); }
    .app-nav a.active { background: var(--brand-tint); color: var(--brand); }

    .container { max-width: 1080px; margin: 0 auto; padding: var(--space-6) var(--space-5) 64px; }

    h1 { font-size: 24px; line-height: 30px; font-weight: 600; margin: 0 0 var(--space-5); letter-spacing: -0.01em; }
    h2 { font-size: 18px; line-height: 24px; font-weight: 600; margin: var(--space-6) 0 var(--space-3); color: var(--ink); }
    h2:first-child { margin-top: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-raised);
      margin-bottom: var(--space-5);
    }
    .card p { margin: 0.35rem 0; }
    .card-muted { color: var(--ink-muted); font-size: 13px; line-height: 18px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--space-4);
    }
    .stat { padding: var(--space-1) 0; }
    .stat-label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      margin-bottom: var(--space-1);
    }
    .stat-value { font-family: var(--font-mono); font-size: 28px; line-height: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .stat-value.neg { color: var(--danger); }

    table { width: 100%; border-collapse: collapse; font-size: 15px; color: var(--ink); }
    th {
      text-align: left;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      padding: var(--space-3);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    td { padding: var(--space-3); border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:hover td { background: var(--surface-sunken); }
    tbody tr:last-child td { border-bottom: none; }

    .amount { text-align: right; font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .amount.neg { color: var(--danger); }

    .pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--info-bg);
      color: var(--info-text);
      white-space: nowrap;
    }
    .pill-one_to_many { background: var(--warning-bg); color: var(--warning-text); }
    .pill-fuzzy_discrepancy { background: var(--danger-bg); color: var(--danger-text); }
    .pill-manual { background: var(--success-bg); color: var(--success-text); }

    .badge-source { font-size: 12px; font-weight: 500; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .digit-bar-track {
      background: var(--surface-sunken);
      border: 1px solid var(--border-control);
      border-radius: var(--radius-sm);
      height: 10px;
      overflow: visible;
      position: relative;
      width: 160px;
    }
    .digit-bar-fill { background: var(--brand); height: 100%; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
    .digit-bar-expected {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 2px;
      background: var(--danger);
    }
    .conformity-close, .conformity-acceptable { background: var(--success-bg); color: var(--success-text); }
    .conformity-marginally_acceptable { background: var(--warning-bg); color: var(--warning-text); }
    .conformity-nonconformity { background: var(--danger-bg); color: var(--danger-text); }

    button, .btn {
      font: inherit;
      font-weight: 500;
      font-size: 14px;
      line-height: 20px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn-primary { background: var(--brand); color: var(--on-brand); }
    .btn-primary:hover { background: var(--brand-hover); }
    .accept { background: var(--success-bg); color: var(--success-text); border-color: var(--success-text); }
    .reject { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-text); }
    .accept:hover, .reject:hover { filter: brightness(0.96); }

    .actions { display: flex; gap: var(--space-2); margin-top: var(--space-4); }

    .suggestion-meta { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
    .suggestion-reason { color: var(--ink-muted); margin: 0 0 var(--space-4); }
    .confidence { font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      margin-top: var(--space-2);
    }
    .alert-danger { background: var(--danger-bg); color: var(--danger-text); }

    .empty-state { color: var(--ink-muted); padding: var(--space-4) 0; }

    label { display: block; font-size: 13px; line-height: 18px; font-weight: 500; margin-bottom: var(--space-1); margin-top: var(--space-3); }
    select, input[type="text"] {
      font: inherit;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-control);
      background: var(--surface);
      color: var(--ink);
      width: 100%;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="{{ url_for('index') }}"><svg viewBox="0 0 96 96" aria-hidden="true"><rect class="mark-tile" width="96" height="96" rx="22"/><path class="mark-bar" d="M24 30H72" stroke-width="9" stroke-linecap="round" fill="none"/><path class="mark-tick" d="M24 58H40L50 68L72 46" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Recwise</a>
      <nav class="app-nav">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} class="active"{% endif %}>Dashboard</a>
        <a href="{{ url_for('review_list') }}"{% if request.endpoint == 'review_list' %} class="active"{% endif %}>Review</a>
        <a href="{{ url_for('statement_view') }}"{% if request.endpoint == 'statement_view' %} class="active"{% endif %}>Statement</a>
        <a href="{{ url_for('analytics_view') }}"{% if request.endpoint == 'analytics_view' %} class="active"{% endif %}>Analytics</a>
      </nav>
    </div>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
