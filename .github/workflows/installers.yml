name: Build desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
      - name: Build Windows installer (.msi, unsigned)
        run: briefcase package windows --packaging-format msi --adhoc-sign --no-input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recwise-windows-msi
          path: dist/*.msi

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
      - name: Build macOS installer (.dmg, ad-hoc signed)
        run: briefcase package macOS --packaging-format dmg --adhoc-sign --no-input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recwise-macos-dmg
          path: dist/*.dmg

  debian-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
      - name: Build Debian installer (.deb, unsigned)
        run: >
          briefcase package linux system
          --target debian:bookworm --packaging-format deb
          --adhoc-sign --no-input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recwise-debian-deb
          path: dist/*.deb

  release:
    # Only for an actual tag push -- a manual workflow_dispatch run still
    # builds and uploads the three workflow artifacts above, but shouldn't
    # create a public release on its own.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-msi, macos-dmg, debian-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: recwise-*
      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/recwise-windows-msi/*.msi \
            artifacts/recwise-macos-dmg/*.dmg \
            artifacts/recwise-debian-deb/*.deb
