[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "recwise"
version = "0.1.0"
description = "Offline bank reconciliation for accountants."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Esperance" }]
dependencies = ["pandas==3.0.6", "openpyxl==3.1.5", "Flask==3.1.3", "textual==8.2.8"]

[project.urls]
Homepage = "https://github.com/EsperanceCo/recwise"

[project.scripts]
recwise-synth = "recwise.synth.cli:main"
recwise-reconcile = "recwise.cli:main"
recwise-review = "recwise.web.cli:main"
recwise-tui = "recwise.tui.cli:main"
recwise-audit = "recwise.analytics.cli:main"
recwise-app = "recwise.desktop_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recwise"]

# Packaged desktop installers (Windows .msi, macOS .app/.dmg, Debian .deb),
# built by `briefcase package <platform>` in CI (see .github/workflows/).
# Briefcase is a build-time tool only -- it is never imported by recwise
# itself and ships nothing into the app's runtime, so it doesn't touch the
# offline guarantee. BSD-3 licensed, actively maintained by BeeWare.
# description/license/license-files/version/author/url below are inherited
# from [project] above; only fields Briefcase can't get from there are set.
[tool.briefcase]
project_name = "Recwise"
bundle = "com.esperance"
# Not MIT/SPDX-listed (PolyForm Internal Use 1.0.0, not open source) --
# stated explicitly so Briefcase doesn't fall back to guessing an SPDX id
# from LICENSE's text (it misidentified it as "MIT" when left implicit).
license = "LicenseRef-PolyForm-Internal-1.0.0"
license-files = ["LICENSE"]

[tool.briefcase.app.recwise]
formal_name = "Recwise"
description = "Offline bank reconciliation for accountants."
sources = ["src/recwise"]
# No GUI toolkit: this launches a local Flask server and opens it in the
# system browser, so it needs no Toga/GUI dependency at all.
console_app = true

[tool.briefcase.app.recwise.macOS]
requires = []

[tool.briefcase.app.recwise.windows]
requires = []

[tool.briefcase.app.recwise.linux]
requires = []

[tool.briefcase.app.recwise.linux.system.debian]
system_requires = []
system_runtime_requires = ["python3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "C4", "SIM"]
# S101 (assert) is expected and fine in tests.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
